# deep_builder_agent 테마 — docs/design/deep_builder_agent_Redesign.html 스타일 가이드 5a.
# 색상 토큰의 단일 진실 원천이다. CSS 주입(ui/style.py)은 config로 표현할 수 없는 것만 담당한다.
# [theme.light]/[theme.dark] 분리 섹션은 설치본 streamlit 1.64.0에서 지원 확인 (BUILD_SPEC.md Phase 8).

[theme]
font = "Pretendard Variable, Pretendard, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0F8C73"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#F3F3F0"
textColor = "#16181C"
borderColor = "#E2E2DD"
linkColor = "#1F6FD1"
greenColor = "#1E8A4C"
orangeColor = "#A86A00"
redColor = "#D0342C"
blueColor = "#1F6FD1"

[theme.light.sidebar]
backgroundColor = "#EFEFEC"

[theme.dark]
primaryColor = "#34D3B0"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#1E2229"
textColor = "#E9EBEE"
borderColor = "#2A2F38"
linkColor = "#6AA8FF"
greenColor = "#3FB968"
orangeColor = "#E0A33A"
redColor = "#F2645A"
blueColor = "#6AA8FF"

[theme.dark.sidebar]
backgroundColor = "#15181D"
